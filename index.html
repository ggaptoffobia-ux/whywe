<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHY WE - Music That's Legal, Curated & Atmospheric</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', system-ui, sans-serif; }
        html { scroll-behavior: smooth; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            33% { transform: translateY(-20px) translateX(10px); }
            66% { transform: translateY(20px) translateX(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.4), 0 0 40px rgba(251, 146, 60, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(236, 72, 153, 0.7), 0 0 60px rgba(251, 146, 60, 0.4); transform: scale(1.05); }
        }
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .pulse-glow-effect { animation: pulse-glow 2.5s ease-in-out infinite; }
        .slide-in-effect { animation: slide-in-right 0.8s ease-out forwards; }
        .shimmer-effect { animation: shimmer 2s ease-in-out infinite; }
        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function WhyWeWebsite() {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const section = document.getElementById(id);
                if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setMobileMenuOpen(false);
            };

            return (
                <div className="min-h-screen bg-black text-white overflow-hidden">
                    <div className="fixed inset-0 -z-10">
                        <div className="absolute inset-0 bg-black"></div>
                        <div className="absolute top-0 left-0 w-96 h-96 bg-purple-600/40 rounded-full blur-3xl animate-float" style={{animation: 'float 6s ease-in-out infinite'}}></div>
                        <div className="absolute top-20 right-10 w-96 h-96 bg-pink-600/40 rounded-full blur-3xl" style={{animation: 'float 8s ease-in-out infinite 1s'}}></div>
                        <div className="absolute bottom-0 left-1/4 w-80 h-80 bg-yellow-500/30 rounded-full blur-3xl" style={{animation: 'float 7s ease-in-out infinite 2s'}}></div>
                        <div className="absolute bottom-20 right-1/4 w-96 h-96 bg-red-600/30 rounded-full blur-3xl" style={{animation: 'float 9s ease-in-out infinite 1.5s'}}></div>
                        <div className="absolute top-1/3 right-1/3 w-72 h-72 bg-orange-500/25 rounded-full blur-3xl" style={{animation: 'float 10s ease-in-out infinite 0.5s'}}></div>
                        <div className="absolute bottom-1/4 right-0 w-80 h-80 bg-pink-500/25 rounded-full blur-3xl" style={{animation: 'float 8s ease-in-out infinite 2.5s'}}></div>
                    </div>

                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-slate-950/95 backdrop-blur py-3' : 'bg-transparent py-6'}`}>
                        <div className="max-w-6xl mx-auto px-6 flex justify-between items-center">
                            <div className="text-2xl font-bold">
                                <span className="bg-gradient-to-r from-pink-400 via-yellow-300 to-orange-400 bg-clip-text text-transparent">WHY WE</span>
                            </div>
                            <div className="hidden md:flex gap-8 text-sm">
                                <button onClick={() => scrollToSection('who-we-are')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Who We Are</button>
                                <button onClick={() => scrollToSection('why-music-matters')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Why Music Matters</button>
                                <button onClick={() => scrollToSection('solutions')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Solution</button>
                                <button onClick={() => scrollToSection('pricing')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Pricing</button>
                                <button onClick={() => scrollToSection('how-it-works')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">How It Works</button>
                                <button onClick={() => scrollToSection('social-proof')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Clients</button>
                                <button onClick={() => scrollToSection('cta')} className="hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Contact</button>
                            </div>
                            <button className="md:hidden bg-none border-none text-white cursor-pointer" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                {mobileMenuOpen ? '✕' : '☰'}
                            </button>
                        </div>
                        {mobileMenuOpen && (
                            <div className="md:hidden bg-slate-950/95 backdrop-blur mt-4 space-y-4 p-6">
                                <button onClick={() => scrollToSection('who-we-are')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Who We Are</button>
                                <button onClick={() => scrollToSection('why-music-matters')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Why Music Matters</button>
                                <button onClick={() => scrollToSection('solutions')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Solution</button>
                                <button onClick={() => scrollToSection('pricing')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Pricing</button>
                                <button onClick={() => scrollToSection('how-it-works')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">How It Works</button>
                                <button onClick={() => scrollToSection('social-proof')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Clients</button>
                                <button onClick={() => scrollToSection('cta')} className="block w-full text-left hover:text-pink-300 transition cursor-pointer bg-none border-none text-white">Contact</button>
                            </div>
                        )}
                    </nav>

                    <section className="pt-32 pb-24 px-6 text-center">
                        <div className="max-w-4xl mx-auto space-y-8">
                            <h1 className="text-5xl md:text-7xl font-bold leading-tight" style={{fontWeight: '700'}}>
                                <span className="bg-gradient-to-r from-pink-400 via-yellow-300 to-orange-400 bg-clip-text text-transparent">Music That's Legal,<br/>Curated & Atmospheric</span>
                            </h1>
                            <p className="text-xl text-slate-300">+23% average check increase. Professional music for HoReCa venues.</p>
                            <button onClick={() => scrollToSection('cta')} className="inline-block px-10 py-4 bg-gradient-to-r from-pink-500 via-yellow-400 to-orange-500 text-white font-bold rounded-3xl hover:shadow-2xl hover:shadow-pink-500/50 transition cursor-pointer pulse-glow-effect" style={{fontWeight: '600', textDecoration: 'none'}}>
                                Get Your Free Audit
                            </button>
                        </div>
                    </section>

                    <section id="who-we-are" className="py-24 px-6 bg-gradient-to-b from-transparent to-pink-950/10">
                        <div className="max-w-3xl mx-auto text-center">
                            <h2 className="text-4xl font-bold mb-6">Who We Are</h2>
                            <p className="text-lg text-slate-300">Professional musicians, DJs, and music selectors with 10+ years in hospitality. We understand venues, guests, and what music actually does.</p>
                        </div>
                    </section>

                    <section id="why-music-matters" className="py-24 px-6">
                        <div className="max-w-5xl mx-auto">
                            <h2 className="text-4xl font-bold mb-16 text-center">Why Music Matters</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-pink-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-pink-400">Business Case</h3>
                                    <p className="text-slate-300">Cornell University: right music = +23% average check. Guests spend more, stay longer, come back.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-yellow-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-yellow-400">Guest Experience</h3>
                                    <p className="text-slate-300">Great music creates the right mood. People feel it. When it's right, they feel at home.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-orange-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-orange-400">Staff Factor</h3>
                                    <p className="text-slate-300">Good music = better vibe = better staff. Your team moves faster, smiles more, earns more tips.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="solutions" className="py-24 px-6 bg-gradient-to-b from-transparent to-pink-950/10">
                        <div className="max-w-5xl mx-auto">
                            <h2 className="text-4xl font-bold mb-16 text-center">The Solution</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/40 to-slate-900/40 border border-white/10 hover:border-pink-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-pink-400">Curated</h3>
                                    <p className="text-slate-300">Professional music selection. Every track reflects your venue's identity. Zero repetition. Maximum impact.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/40 to-slate-900/40 border border-white/10 hover:border-yellow-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-yellow-400">Atmospheric</h3>
                                    <p className="text-slate-300">Different music for different hours. Morning, lunch, dinner — each with its own vibe. Guests stay longer. Check increases.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/40 to-slate-900/40 border border-white/10 hover:border-orange-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-4 text-orange-400">Legal</h3>
                                    <p className="text-slate-300">Full EMRA compliance. No fines. No risk. Your business is protected. Complete peace of mind.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="pricing" className="py-24 px-6">
                        <div className="max-w-5xl mx-auto">
                            <h2 className="text-4xl font-bold mb-4 text-center">Choose Your Level</h2>
                            <p className="text-center text-slate-400 mb-16">One-time setup + ongoing monthly costs</p>
                            <div className="grid md:grid-cols-3 gap-6 mb-12">
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-pink-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-2">Basic</h3>
                                    <p className="text-4xl font-bold text-pink-400 mb-6">$500</p>
                                    <p className="text-slate-300">One playlist. Repeats daily.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-yellow-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-2">Medium</h3>
                                    <p className="text-4xl font-bold text-yellow-400 mb-6">$750</p>
                                    <p className="text-slate-300">Three playlists. Three days of music.</p>
                                </div>
                                <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-800/60 to-slate-900/40 border border-slate-600/50 hover:border-orange-400/50 transition backdrop-blur">
                                    <h3 className="text-2xl font-bold mb-2">Premium</h3>
                                    <p className="text-4xl font-bold text-orange-400 mb-6">$1,000</p>
                                    <p className="text-slate-300">Seven playlists. Seven days. Zero repeats.</p>
                                </div>
                            </div>
                            <div className="max-w-2xl mx-auto p-8 rounded-3xl bg-gradient-to-br from-pink-500/10 to-orange-500/10 border border-pink-400/30 backdrop-blur">
                                <h3 className="text-2xl font-bold mb-6 text-center">Monthly Costs</h3>
                                <div className="space-y-4 text-slate-300">
                                    <div className="flex justify-between"><span>Streaming + Licensing</span><span className="font-semibold text-pink-400">$44/mo</span></div>
                                    <div className="flex justify-between"><span>Optional: Manual Updates</span><span className="font-semibold text-yellow-400">$100/mo</span></div>
                                    <div className="border-t border-pink-400/30 pt-4 flex justify-between text-lg font-bold"><span>Total Monthly</span><span className="text-transparent bg-gradient-to-r from-pink-400 to-orange-400 bg-clip-text">$44/mo</span></div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="how-it-works" className="py-24 px-6 bg-gradient-to-b from-transparent to-orange-950/10">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl font-bold mb-16 text-center">How It Works</h2>
                            <div className="space-y-8">
                                {[
                                    { num: '01', title: 'Assessment', desc: 'We audit your place — hours, peak days, demographics.' },
                                    { num: '02', title: 'Strategy', desc: 'We build a music strategy aligned with your brand.' },
                                    { num: '03', title: 'Track Selection', desc: 'We curate tracks that keep guests engaged.' },
                                    { num: '04', title: 'Integration', desc: 'We integrate into your infrastructure.' },
                                    { num: '05', title: 'Ongoing Support', desc: '24/7 support. Regular updates. Feedback-based adjustments.' }
                                ].map((step, idx) => (
                                    <div key={idx} className="flex gap-6 items-start slide-in-effect" style={{animationDelay: `${idx * 0.1}s`}}>
                                        <div className="text-4xl font-bold text-transparent bg-gradient-to-r from-pink-400 via-yellow-400 to-orange-400 bg-clip-text shimmer-effect">{step.num}</div>
                                        <div>
                                            <h3 className="text-2xl font-bold mb-2">{step.title}</h3>
                                            <p className="text-slate-300">{step.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="social-proof" className="py-24 px-6">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl font-bold mb-12 text-center">Already Working With Us</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                {['Hookah Place Marina', 'Hookah Place DIFC', 'Hookah Place Downtown', 'Hookah Place ADY'].map((venue, idx) => (
                                    <div key={idx} className="p-6 rounded-2xl bg-gradient-to-br from-slate-800/50 to-slate-900/30 border border-pink-400/30 text-center hover:border-pink-300/70 transition backdrop-blur">
                                        <p className="font-semibold">{venue}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="cta" className="py-24 px-6 bg-gradient-to-b from-pink-950/20 to-orange-950/20">
                        <div className="max-w-3xl mx-auto text-center space-y-8">
                            <h2 className="text-4xl font-bold">Ready to Increase Your Check Average?</h2>
                            <p className="text-lg text-slate-300">We'll conduct a free audit of your venue.<br/>No cost. No commitment.</p>
                            <a href="https://t.me/wermur" target="_blank" rel="noopener noreferrer" className="inline-block px-10 py-4 bg-gradient-to-r from-pink-500 via-yellow-400 to-orange-500 text-white font-bold rounded-3xl hover:shadow-2xl hover:shadow-pink-500/50 transition cursor-pointer pulse-glow-effect" style={{textDecoration: 'none'}}>
                                Schedule Your Free Audit
                            </a>
                            <div className="flex flex-col sm:flex-row justify-center gap-6 text-slate-300 mt-12">
                                <a href="mailto:whywemusic@yahoo.com" className="flex items-center gap-2 hover:text-pink-300 transition">
                                    📧 whywemusic@yahoo.com
                                </a>
                            </div>
                        </div>
                    </section>

                    <footer className="py-8 px-6 border-t border-pink-400/20 text-center text-slate-500 text-sm">
                        <p>© 2025 WHY WE. Music That's Legal, Curated & Atmospheric.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<WhyWeWebsite />, document.getElementById('root'));
    </script>
</body>
</html>
